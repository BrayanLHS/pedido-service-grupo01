spring.application.name=pedido-service-grupo01
server.port=8071

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.refresh.enable=false
spring.config.import=optional:configserver:http://localhost:8888
spring.profiles.active=dev
management.endpoints.web.exposure.include=refresh,health,info
management.endpoint.health.show-details=always
spring.cloud.openfeign.client.config.default.connect-timeout=5000
spring.cloud.openfeign.client.config.default.read-timeout=5000
ecom.impuesto-igv=18
ecom.monto-minimo-envio-gratis=100
ecom.mensaje-bienvenida=Bienvenido al sistema de pedidos (Local)
spring.datasource.url=jdbc:mysql://localhost:3306/pedidos_default
